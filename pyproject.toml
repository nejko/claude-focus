[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-focus"
dynamic = ["version"]
description = "One priority queue over all your running Claude Code sessions in herdr (macOS, Windows) or iTerm2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nejc Skoberne"}]
dependencies = [
    "iterm2>=2.25; sys_platform == 'darwin'",   # the iTerm2 bridge (macOS only)
    "psutil>=5.9; sys_platform == 'win32'",     # processes on Windows (os.kill(pid, 0) sends Ctrl+C there)
]
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/nejko/claude-focus"
Issues = "https://github.com/nejko/claude-focus/issues"

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.0"]  # the jev scorer (config "scorer": "jev"; needs a TypeSafe key)

[project.scripts]
claude-focus = "claude_focus.cli:main"

[tool.setuptools]
packages = ["claude_focus"]

[tool.setuptools.dynamic]
version = {attr = "claude_focus.__version__"}

[tool.setuptools.package-data]
claude_focus = ["priorities.template.md", "claude_md_rule.md"]
